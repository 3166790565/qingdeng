name: qingdeng

services:
  web:
    image: ${IMAGE:-bxacc123/qingdeng:latest}
    container_name: qingdeng
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NOVEL_DATA_DIR: /data
      NOVEL_DB_PATH: /data/${DB_FILE:-novel.db}
      TZ: Asia/Shanghai

    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8000}:8000"

    volumes:
      - ./data:/data

    # 代理跑在宿主机上时，容器里的 127.0.0.1 指不到它。
    # extra_hosts 让 host.docker.internal 在 Linux 上也能解析（Docker Desktop 自带）。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8000 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
